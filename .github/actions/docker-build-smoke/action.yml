name: Build and smoke-test Docker image
description: Build the repository image and verify health plus the auth gate before any publish.
runs:
  using: composite
  steps:
    - name: Compute docker-safe image name
      shell: bash
      run: |
        set -euo pipefail
        name="${GITHUB_REPOSITORY,,}"
        while [[ "$name" =~ [-._]$ ]]; do name="${name%?}"; done
        echo "IMAGE=ghcr.io/${name}" >> "$GITHUB_ENV"
        echo "IMAGE_SHA=ghcr.io/${name}:sha-${GITHUB_SHA}" >> "$GITHUB_ENV"
        echo "image: ghcr.io/${name}"

    - name: Build image (same Dockerfile the container platforms build)
      shell: bash
      run: |
        set -uo pipefail
        if ! docker build \
          --build-arg CELA_IMAGE_REF="$IMAGE_SHA" \
          --build-arg CELA_BUILD_SHA="$GITHUB_SHA" \
          --build-arg "CELA_BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          -t "$IMAGE_SHA" . > docker-build.log 2>&1; then
          echo "::error::docker build failed: $(tail -c 600 docker-build.log | tr '\n' ' ')"
          exit 1
        fi

    - name: Smoke test — container boots, /health ok, auth gate rejects
      shell: bash
      run: |
        set -euo pipefail
        docker run -d --name smoke \
          -e CELA_API_TOKEN=ci-smoke-token \
          -e CELA_PRIVATE_API_TOKEN=ci-smoke-private \
          -p 8080:8080 "$IMAGE_SHA"

        for i in $(seq 1 45); do
          if curl -fsS http://127.0.0.1:8080/health 2>/dev/null | grep -q '"status":"ok"'; then
            echo "/health OK after ~$((i*2))s"
            break
          fi
          if [ "$i" = "45" ]; then
            echo "container never became healthy"; docker logs smoke; exit 1
          fi
          sleep 2
        done

        curl -fsS http://127.0.0.1:8080/health | grep -q '"status":"ok"'

        # The runtime must not be root: the service needs no privileged port and
        # every code-exec backend already fails closed in this image. Asserting
        # it on the running container keeps a dropped `USER` from shipping.
        uid=$(docker exec smoke id -u)
        if [ "$uid" = "0" ]; then
          echo "::error::container runs as root (uid 0); the image must switch USER"
          docker logs smoke
          exit 1
        fi
        echo "container runs as non-root uid $uid"

        code=$(curl -s -o /dev/null -w '%{http_code}' \
          "http://127.0.0.1:8080/cela/v1/runs?limit=1" \
          -H "Authorization: Bearer definitely-wrong-token")
        if [ "$code" != "401" ]; then
          echo "auth gate returned $code (expected 401)"
          docker logs smoke
          exit 1
        fi
        echo "smoke test passed"
