name: Real-model eval (manual, secrets-injected)

# Manual only: repository secrets are available to workflow_dispatch runs
# from collaborators, never to fork PRs. The API key travels exactly one
# path — secret -> env var -> model client — and is never printed.
on:
  workflow_dispatch:
    inputs:
      model_url:
        description: "Private API base URL (OpenAI-compatible, e.g. https://gateway.example.com/v1)"
        required: true
        type: string
      model_id:
        description: "Model identifier on that API"
        required: true
        type: string
      auth_header:
        description: "How the gateway expects the key"
        required: true
        default: Authorization
        type: choice
        options: [Authorization, x-api-key]
      ab_skills:
        description: "Run A/B (without vs with skill learning)"
        required: true
        default: true
        type: boolean

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,server]"
      - name: Check the secret reached the runner
        env:
          CELA_EVAL_API_KEY: ${{ secrets.APIDOG_ACCESS_TOKEN }}
        run: |
          if [ -z "${CELA_EVAL_API_KEY:-}" ]; then
            echo "::error title=Missing secret::Repository secret APIDOG_ACCESS_TOKEN is empty or unset — add it in Settings > Secrets and variables > Actions, then re-run."
            exit 1
          fi
      - name: Run eval against the private API
        env:
          # The secret value exists only inside this step's environment.
          CELA_EVAL_API_KEY: ${{ secrets.APIDOG_ACCESS_TOKEN }}
          # Inputs reach the shell as environment variables, never spliced into
          # the script text: a '${{ inputs.model_url }}' placeholder expanded
          # inside quotes would hand argparse the URL with its quote
          # characters still attached, and fail every case.
          MODEL_URL: ${{ inputs.model_url }}
          MODEL_ID: ${{ inputs.model_id }}
          AUTH_HEADER: ${{ inputs.auth_header }}
          AB_SKILLS: ${{ inputs.ab_skills }}
        run: |
          set -euo pipefail
          args=(run --suite builtin
            --model-url "$MODEL_URL"
            --model-id "$MODEL_ID"
            --auth-header "$AUTH_HEADER"
            --api-key-env CELA_EVAL_API_KEY
            --out eval-report.json)
          if [ "$AB_SKILLS" = "true" ]; then args+=(--ab-skills); fi
          # Safe to echo: every argument is non-secret by construction — the
          # key travels only through $CELA_EVAL_API_KEY, and argparse receives
          # the *name* of that variable, never its value.
          echo "running: python -m os_evals ${args[*]}"
          python -m os_evals "${args[@]}"
      - name: Upload report
        # Always: even a failed run (A/B regression, unreachable endpoint)
        # produces the report that explains why.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval-report.json
          if-no-files-found: warn
