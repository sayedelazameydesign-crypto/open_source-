name: Real-model eval (manual, secrets-injected)

# Manual only: repository secrets are available to workflow_dispatch runs
# from collaborators, never to fork PRs. The API key travels exactly one
# path — secret -> env var -> model client — and is never printed.
on:
  workflow_dispatch:
    inputs:
      model_url:
        description: "Private API base URL (OpenAI-compatible, e.g. https://gateway.example.com/v1)"
        required: true
        type: string
      model_id:
        description: "Model identifier on that API"
        required: true
        type: string
      auth_header:
        description: "How the gateway expects the key"
        required: true
        default: Authorization
        type: choice
        options: [Authorization, x-api-key]
      ab_skills:
        description: "Run A/B (without vs with skill learning)"
        required: true
        default: true
        type: boolean

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,server]"
      - name: Run eval against the private API
        env:
          # The secret value exists only inside this step's environment.
          CELA_EVAL_API_KEY: ${{ secrets.APIDOG_ACCESS_TOKEN }}
        run: |
          ARGS="run --suite builtin --model-url '${{ inputs.model_url }}' --model-id '${{ inputs.model_id }}' --auth-header '${{ inputs.auth_header }}' --api-key-env CELA_EVAL_API_KEY --out eval-report.json"
          if [ "${{ inputs.ab_skills }}" = "true" ]; then ARGS="$ARGS --ab-skills"; fi
          python -m os_evals $ARGS
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval-report.json
