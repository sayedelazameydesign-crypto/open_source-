name: Deploy verification (manual)

# Manual post-deploy check of the Render service. Runs only on workflow_dispatch.
# The service URL is resolved from the Render API using the RENDER_API_KEY
# repository secret; secrets are passed through env and never echoed.
# Read-only on the repository: it checks the deployment and changes nothing.

on:
  workflow_dispatch:
    inputs:
      expect_kind:
        description: "execution.kind the published service must report"
        required: false
        default: "scripted"
        type: choice
        options: [scripted, provider_adapter, any]

permissions:
  contents: read

concurrency:
  group: deploy-verify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A preview deployment must answer 'scripted'; flipping this to
    # 'provider_adapter' is only honest after §2.6 of the free-tier runbook was
    # actually completed (live adapter + key in Render).
    env:
      EXPECT_KIND: ${{ inputs.expect_kind }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install
        # `distributed` is not optional here: the Doctor step below receives
        # CELA_RUN_STORE_URL from the secret store, and the doctor refuses a
        # Postgres run store when psycopg is not importable (scripts/deploy_doctor.py
        # -> postgres_driver_missing). Installing only ".[dev,server]" therefore fails
        # the run before the deployment is ever probed. This extras set mirrors the
        # service build in render.yaml ("[server,distributed]").
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,server,distributed]"

      - name: Resolve Render service URL
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${RENDER_API_KEY:-}" ]; then
            echo "::error title=Preflight::RENDER_API_KEY secret is empty or unset."
            exit 1
          fi
          curl -sS -f -m 30 \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Accept: application/json" \
            "https://api.render.com/v1/services?name=celia-mission-os-api&limit=5" \
            -o services.json
          URL=$(python - <<'PY'
          import json, sys
          try:
              items = json.load(open("services.json"))
          except (OSError, ValueError) as exc:
              # A non-JSON body is a proxy/login page, not a Render answer; say so
              # instead of drowning the operator in a traceback.
              sys.exit("Render API returned an unreadable response (%s: %s)" % (type(exc).__name__, exc))
          if not isinstance(items, list):
              sys.exit("Render API returned %s, expected a list of services" % type(items).__name__)
          matches = [i["service"] for i in items if i.get("service", {}).get("name") == "celia-mission-os-api"]
          if len(matches) != 1:
              sys.exit("expected exactly one service named celia-mission-os-api, found %d" % len(matches))
          url = matches[0].get("serviceDetails", {}).get("url", "")
          if not url.startswith("https://"):
              sys.exit("service has no https URL yet (is it deployed?)")
          print(url)
          PY
          )
          echo "Resolved service URL: ${URL}"
          echo "API_URL=${URL}" >> "$GITHUB_ENV"
          rm -f services.json

      - name: Doctor (strict)
        # RENDER=true is what makes this step a Render gate rather than a local
        # preflight: the doctor hangs its Render rules (persistent_run_store_required,
        # code_exec_not_disabled incl. the render.yaml blueprint) on `is_render`,
        # and GitHub runners never set RENDER — without it a missing
        # CELA_RUN_STORE_URL passes green with store_backend_scheme: memory.
        # CELA_CODE_EXEC_MODE=disabled is declared alongside it, mirroring
        # render.yaml, so the step cannot fail with code_exec_not_disabled for a
        # reason unrelated to storage; it is a literal, never a secret.
        env:
          RENDER: "true"
          CELA_CODE_EXEC_MODE: disabled
          CELA_API_TOKEN: ${{ secrets.CELA_API_TOKEN }}
          CELA_PRIVATE_API_TOKEN: ${{ secrets.CELA_PRIVATE_API_TOKEN }}
          CELA_RUN_STORE_URL: ${{ secrets.CELA_RUN_STORE_URL }}
          CELA_BACKEND_URL: ${{ env.API_URL }}
        run: python scripts/deploy_doctor.py --strict

      - name: Verify deployment
        env:
          CELA_API_TOKEN: ${{ secrets.CELA_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CELA_API_TOKEN:-}" ]; then
            echo "::error title=Preflight::CELA_API_TOKEN secret is empty or unset."
            exit 1
          fi
          # The input is a closed choice, but the value still arrives through env
          # rather than being interpolated into this shell line, and is re-checked:
          # a hand-edited default must not reach the probe as an arbitrary string.
          case "${EXPECT_KIND:-scripted}" in
            scripted | provider_adapter | any) EXPECT="${EXPECT_KIND:-scripted}" ;;
            *)
              echo "::error title=Preflight::EXPECT_KIND must be scripted, provider_adapter or any."
              exit 2
              ;;
          esac
          echo "Verifying ${API_URL} expects execution.kind == ${EXPECT}"
          make verify-deploy API="${API_URL}" EXPECT_KIND="${EXPECT}"
