name: Postgres persistence (C6, real PostgreSQL)

# Manual, secrets-injected run of scripts/test_postgres_persistence.py.
# The DSNs travel only from repository secrets to step env to the script.
# Nothing here can choose a different target: the script itself refuses to
# write unless the test DSN resolves to a different database than the
# production reference (see its _resolve_dsn guard and --yes requirement).
# Push bootstraps runs before workflow_dispatch exists on the default branch.
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/postgres-persistence.yml"

permissions:
  contents: read

concurrency:
  group: postgres-persistence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  c6:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Push to main is the merge itself: only dispatch should write there.
    if: github.event_name == 'workflow_dispatch' || github.ref_name != 'main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[server,distributed]"
      - name: Preflight — commit and credential presence (names only)
        env:
          CELA_TEST_POSTGRES_DSN: ${{ secrets.CELA_TEST_POSTGRES_DSN }}
          CELA_RUN_STORE_URL: ${{ secrets.CELA_RUN_STORE_URL }}
          CELA_ALLOW_C6_WRITE: ${{ secrets.CELA_ALLOW_C6_WRITE }}
        run: |
          set -euo pipefail
          # Evidence is only evidence with the tree it came from: the log names
          # the exact commit, so a PASS line can be matched to a checkout later.
          echo "commit sha: ${GITHUB_SHA}"
          echo "ref: ${GITHUB_REF}"
          if [ -z "${CELA_TEST_POSTGRES_DSN:-}" ]; then
            echo "::error title=Preflight::Repository secret CELA_TEST_POSTGRES_DSN is empty or unset. Add the Session-pooler DSN of a dedicated TEST Supabase project (Settings > Secrets and variables > Actions), then re-run. The value is never printed."
            exit 1
          fi
          # Write-arm switch, same pattern as A1/A6's ALLOW_LIVE_EXTERNAL_CALLS:
          # the DSNs being present never arms a database write on its own. Only
          # the literal string "true" does, so a re-run stays red (and writes
          # nothing) until the operator deliberately arms it.
          if [ "${CELA_ALLOW_C6_WRITE:-}" != "true" ]; then
            echo "::error title=Preflight::Repository secret CELA_ALLOW_C6_WRITE is not 'true', so no database write is armed. Set it to 'true' (Settings > Secrets and variables > Actions) only when the TEST DSN above points at a dedicated test database, then re-run."
            exit 1
          fi
          if [ -z "${CELA_RUN_STORE_URL:-}" ]; then
            echo "::notice title=Preflight::CELA_RUN_STORE_URL is unset, so the run cannot prove the test database is separate from production. It will be labelled SEPARATION IS UNVERIFIED. Add the production DSN as that secret to close C6 fully."
          fi
      - name: Run C6 persistence test (writes, then deletes its own rows)
        if: success()
        env:
          CELA_TEST_POSTGRES_DSN: ${{ secrets.CELA_TEST_POSTGRES_DSN }}
          # Production reference only: compared against, never connected to
          # and never used as the write target (the script enforces this).
          CELA_RUN_STORE_URL: ${{ secrets.CELA_RUN_STORE_URL }}
        run: |
          set -o pipefail
          args=(--yes)
          if [ -z "${CELA_RUN_STORE_URL:-}" ]; then
            args+=(--no-production-reference)
          fi
          python scripts/test_postgres_persistence.py "${args[@]}" 2>&1 | tee postgres-persistence.log
      - name: Publish verdict as check annotations
        if: always()
        run: python scripts/publish_acceptance_annotations.py postgres-persistence.log --title C6
      - name: Upload log
        # Always: a failed criterion is exactly the evidence someone needs.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-persistence-log
          path: postgres-persistence.log
          if-no-files-found: warn
          retention-days: 14
