name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,server]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

      - name: Smoke-test the ReAct demo end to end
        run: |
          export PYTHONPATH=packages/os_core:packages/os_agents:packages/os_tools:packages/os_orchestration:packages/os_server
          python -m os_server.cli run --demo "Sum 0..100" | tee /tmp/out
          grep -q "5050" /tmp/out
