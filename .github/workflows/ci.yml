name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,server]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: |
          set -o pipefail
          pytest -q -rf 2>&1 | tee /tmp/pytest.log || {
            # Surface the failure as check annotations, not only inside a log
            # file: raw step logs need a GitHub login and a log download, while
            # annotations are readable from the API and the PR itself. The
            # FAILED lines carry the test id and its assertion summary.
            failed="$(grep -E '^(FAILED|ERROR)' /tmp/pytest.log | head -5 | tr '\n' ';')"
            echo "::error title=pytest failures::${failed:-no FAILED lines: collection error?}"
            echo "::error title=pytest tail::$(tail -8 /tmp/pytest.log | tr '\n' ';')"
            exit 1
          }

      - name: Smoke-test the ReAct demo end to end
        run: |
          export PYTHONPATH=packages/os_core:packages/os_agents:packages/os_tools:packages/os_orchestration:packages/os_server:packages/os_mcp
          python -m os_server.cli run --demo "Sum 0..100" | tee /tmp/out
          grep -q "5050" /tmp/out

      - name: Smoke-test the run-outcome ledger
        run: |
          export PYTHONPATH=packages/os_core:packages/os_agents:packages/os_tools:packages/os_orchestration:packages/os_server:packages/os_mcp
          export CELA_LEDGER_PATH=/tmp/run-ledger.jsonl
          # The run must report where it recorded itself …
          python -m os_server.cli run --demo "Sum 0..100" | tee /tmp/out | grep -q "ledger:"
          # … the file must exist on disk with a success outcome …
          test -s /tmp/run-ledger.jsonl
          grep -q '"outcome":"success"' /tmp/run-ledger.jsonl
          # … and the reader must summarise it.
          python -m os_server.cli ledger --limit 5 | tee /tmp/ledger | grep -q "success_rate=1.00"
