[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-source"
version = "0.1.0"
description = "A small, well-tested Python package — starter template for open-source work."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "open_source maintainers" }]
keywords = ["open-source", "template", "starter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "build>=1.2",
]

[project.urls]
Homepage = "https://github.com/YOUR-USERNAME/open_source"
Repository = "https://github.com/YOUR-USERNAME/open_source"
Issues = "https://github.com/YOUR-USERNAME/open_source/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/open_source"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=open_source --cov-report=term-missing"
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["open_source"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
