[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-source-platform"
version = "0.1.0"
description = "Autonomous & interactive AI platform on a fully open-source 2026 stack: agentic reasoning + artifacts + sandboxed execution."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "open_source maintainers" }]
keywords = ["agents", "llm", "mcp", "sandbox", "open-source"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]
server = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=13.0",
]
browser = [
    "playwright>=1.47",
]

[project.urls]
Homepage = "https://github.com/sayedelazameydesign-crypto/open_source-"
Repository = "https://github.com/sayedelazameydesign-crypto/open_source-"
Issues = "https://github.com/sayedelazameydesign-crypto/open_source-/issues"

[tool.hatch.build.targets.wheel]
packages = [
    "packages/os_core/os_core",
    "packages/os_agents/os_agents",
    "packages/os_tools/os_tools",
    "packages/os_orchestration/os_orchestration",
    "packages/os_server/os_server",
]

# --- Monorepo path setup: every package is importable without installation ---
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = [
    "packages/os_core",
    "packages/os_agents",
    "packages/os_tools",
    "packages/os_orchestration",
    "packages/os_server",
    "packages/legacy/src",
]
markers = [
    "network: tests that require real network access (deselected by default)",
    "browser: tests that require a real Playwright browser",
]
filterwarnings = ["error::RuntimeWarning"]

[tool.coverage.run]
branch = true
source = ["os_core", "os_agents", "os_tools", "os_orchestration", "os_server"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["packages", "tests"]
extend-exclude = ["packages/legacy", "packages/web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "ASYNC"]
ignore = ["RUF001", "RUF002", "RUF003", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "S101"]
"packages/*/os_*/__init__.py" = ["F401"]
