[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cela-use-browser"
version = "0.1.0"
description = "cela_use_browser — autonomous browser & sandboxed execution platform with a dedicated private API (/cela/v1 + CelaBrowser facade)."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "open_source maintainers" }]
keywords = ["agents", "llm", "mcp", "sandbox", "open-source"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]
server = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=13.0",
]
browser = [
    "playwright>=1.47",
]
sandbox = [
    "e2b-code-interpreter>=1.5",
]
# Agent-Reach is not on PyPI (the maintainers explicitly warn about the
# unrelated package of that name there), so the adapter pins the GitHub repo at
# a known commit. Install only when the CLI-shaped channels are wanted:
#   pip install -e ".[dev,server,reach]"
reach = [
    "agent-reach @ git+https://github.com/Panniantong/agent-reach@94f06c1969dfc1834001269d79d3ad0972d9dee6",
]
distributed = [
    "psycopg[binary]>=3.2",
    "redis>=5.0",
]
ai = [
    "scikit-learn>=1.5",
    "spacy>=3.7",
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8",
    "opencv-python-headless>=4.10",
    "paddleocr>=2.8",
    "faster-whisper>=1.0",
]

[project.urls]
Homepage = "https://github.com/sayedelazameydesign-crypto/open_source-"
Repository = "https://github.com/sayedelazameydesign-crypto/open_source-"
Issues = "https://github.com/sayedelazameydesign-crypto/open_source-/issues"

# The optional `reach` extra pins Agent-Reach from GitHub by full commit SHA
# (it is not published on PyPI on purpose). Hatchling refuses direct references
# unless this is set, and without it `pip install -e ".[dev,server]"` fails at
# metadata generation — so the flag is load-bearing for every install path.
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = [
    "packages/os_core/os_core",
    "packages/os_agents/os_agents",
    "packages/os_tools/os_tools",
    "packages/os_orchestration/os_orchestration",
    "packages/os_server/os_server",
    "packages/os_evals/os_evals",
    "packages/os_skills/os_skills",
    "packages/os_reach/os_reach",
]

# --- Monorepo path setup: every package is importable without installation ---
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = [
    "packages/os_core",
    "packages/os_agents",
    "packages/os_tools",
    "packages/os_orchestration",
    "packages/os_server",
    "packages/os_evals",
    "packages/os_skills",
    "packages/os_reach",
    "packages/legacy/src",
]
markers = [
    "network: tests that require real network access (deselected by default)",
    "browser: tests that require a real Playwright browser",
]
filterwarnings = ["error::RuntimeWarning"]

[tool.coverage.run]
branch = true
source = ["os_core", "os_agents", "os_tools", "os_orchestration", "os_server", "os_evals", "os_skills", "os_reach"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["packages", "tests"]
extend-exclude = ["packages/legacy", "packages/web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "ASYNC"]
ignore = ["RUF001", "RUF002", "RUF003", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "S101"]
"packages/*/os_*/__init__.py" = ["F401"]
# ASYNC109 wants timeouts expressed via asyncio.timeout() rather than a
# parameter. The sandbox is the exception: a per-call timeout is part of the
# CodeExecBackend contract, because the caller — not the backend — owns the
# deadline for untrusted code. Likewise, CelaBrowser.browse/wait accept a
# caller wait deadline while shielding the underlying run task.
"packages/os_tools/os_tools/code_exec.py" = ["ASYNC109"]
"packages/os_server/os_server/cela.py" = ["ASYNC109"]
